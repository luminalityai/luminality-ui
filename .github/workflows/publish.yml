name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Run without publishing"
        type: boolean
        default: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      # OIDC trusted publishing needs npm >= 11.5.1, and node 20 ships npm 10.
      # Pin the major rather than tracking `@latest`: npm 12 requires node
      # >= 22.22.2, so `npm@latest` started failing EBADENGINE against the
      # node 20 runner above the moment npm 12 shipped — which is exactly how
      # the v0.8.0 publish broke. Same pin sidekick-ui uses.
      - name: Ensure npm supports OIDC trusted publishing (>= 11.5.1)
        run: npm install -g npm@^11

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build package
        run: npm run build

      - name: Verify d.ts entry exports types
        run: |
          set -eu

          # This package emits a MULTI-FILE declaration tree: dist/index.d.ts is a
          # thin re-export barrel that carries no `declare` of its own and points at
          # sibling .d.ts files. So "does index.d.ts itself declare things" is the
          # wrong question here — but the old `grep -q '^export'` was too weak in the
          # other direction, because a bare `export { }` stub passes it. sidekick-ui
          # shipped exactly that stub (sidekick-ui#122): v0.7.0 built "successfully",
          # was tagged, and was never publishable. Guard the shape we actually have.

          if [ ! -f dist/index.d.ts ]; then
            echo "::error::dist/index.d.ts is missing — check the dts plugin config (entryRoot must match the build entry directory)."
            exit 1
          fi

          # 1. The barrel must re-export something real — `export *` or a named list
          #    with at least one identifier in it. An empty `export { }` fails here.
          if ! grep -qE "^export[[:space:]]+(\*|\{[[:space:]]*[A-Za-z_])" dist/index.d.ts; then
            echo "::error::dist/index.d.ts has no non-empty re-exports (looks like an empty 'export { }' stub) — the declaration build is broken. See sidekick-ui#122."
            echo "::group::dist/index.d.ts"
            cat dist/index.d.ts
            echo "::endgroup::"
            exit 1
          fi

          # 2. Every module the barrel points at must actually exist on disk —
          #    a dangling re-export type-errors in the consumer, not here.
          missing=0
          for spec in $(grep -oE "from '\./[^']+'" dist/index.d.ts | sed "s/^from '//; s/'$//"); do
            if [ ! -f "dist/${spec}.d.ts" ] && [ ! -f "dist/${spec}/index.d.ts" ]; then
              echo "::error::dist/index.d.ts re-exports from '${spec}', but no matching .d.ts was emitted."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

          # 3. The tree behind the barrel must contain real type declarations.
          DECL_FILES=$(grep -rlE '\bdeclare\b' dist --include='*.d.ts' | wc -l | tr -d ' ')
          if [ "$DECL_FILES" -lt 10 ]; then
            echo "::error::Only $DECL_FILES .d.ts files under dist/ contain declarations — implausibly few for the full public API. Suspect a broken declaration build."
            exit 1
          fi
          echo "::notice::Declaration tree OK — $DECL_FILES .d.ts files with declarations behind dist/index.d.ts"

      - name: Verify subpath exports resolve
        run: |
          set -eu
          # ./theme.css (the raw design tokens) is generated by a post-build step,
          # not by Vite — so a build that "succeeds" can still ship a package whose
          # declared export 404s for every consumer. Assert each exports target
          # exists in the build output.
          node -e '
            const fs = require("fs");
            const { exports: exp } = require("./package.json");
            const targets = [];
            const walk = (v) => typeof v === "string" ? targets.push(v) : Object.values(v).forEach(walk);
            walk(exp);
            const missing = targets.filter((t) => !fs.existsSync(t.replace(/^\.\//, "")));
            if (missing.length) {
              console.log(`::error::package.json "exports" points at files the build did not produce: ${missing.join(", ")}`);
              process.exit(1);
            }
            console.log(`::notice::All ${targets.length} "exports" targets present: ${targets.join(", ")}`);
          '

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Check version consistency
        if: github.event_name == 'release'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi
          echo "Version $PKG_VERSION is consistent"

      - name: Pack tarball
        run: |
          npm pack --ignore-scripts 2>/dev/null
          TARBALL=$(ls *.tgz)
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        continue-on-error: true
        with:
          subject-path: ${{ env.TARBALL }}

      - name: Publish package
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry-run }}" = "true" ]; then
            echo "::notice::Dry run — skipping publish"
            npm publish --dry-run
          else
            echo "::notice::Publishing ${{ env.TARBALL }} via OIDC trusted publishing"
            npm publish
          fi
