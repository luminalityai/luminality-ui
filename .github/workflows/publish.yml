name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Run without publishing"
        type: boolean
        default: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false # release/publish path: no cache restore (zizmor cache-poisoning)
          registry-url: "https://registry.npmjs.org"

      # OIDC trusted publishing needs npm >= 11.5.1, and node 20 ships npm 10.
      # Pin the major rather than tracking `@latest`: npm 12 requires node
      # >= 22.22.2, so `npm@latest` started failing EBADENGINE against the
      # node 20 runner above the moment npm 12 shipped — which is exactly how
      # the v0.8.0 publish broke. Same pin sidekick-ui uses.
      - name: Ensure npm supports OIDC trusted publishing (>= 11.5.1)
        run: npm install -g npm@^11

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build package
        run: npm run build

      - name: Verify d.ts entry exports types
        # dist/index.d.ts is ONE rolled-up file (vite-plugin-dts `bundleTypes`).
        # The script fails on a missing file, an empty `export { }` stub
        # (sidekick-ui#122), an un-rolled `export *` barrel (delivery-ops#441),
        # a file that does not typecheck with skipLibCheck: false, or any
        # mismatch between its exports and dist/index.js's.
        run: node scripts/verify-dts.mjs

      - name: Verify subpath exports resolve
        run: |
          set -eu
          # ./theme.css (the raw design tokens) is generated by a post-build step,
          # not by Vite — so a build that "succeeds" can still ship a package whose
          # declared export 404s for every consumer. Assert each exports target
          # exists in the build output.
          node -e '
            const fs = require("fs");
            const { exports: exp } = require("./package.json");
            const targets = [];
            const walk = (v) => typeof v === "string" ? targets.push(v) : Object.values(v).forEach(walk);
            walk(exp);
            const missing = targets.filter((t) => !fs.existsSync(t.replace(/^\.\//, "")));
            if (missing.length) {
              console.log(`::error::package.json "exports" points at files the build did not produce: ${missing.join(", ")}`);
              process.exit(1);
            }
            console.log(`::notice::All ${targets.length} "exports" targets present: ${targets.join(", ")}`);
          '

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Check version consistency
        if: github.event_name == 'release'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi
          echo "Version $PKG_VERSION is consistent"

      - name: Pack tarball
        run: |
          npm pack --ignore-scripts 2>/dev/null
          TARBALL=$(ls *.tgz)
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        continue-on-error: true
        with:
          subject-path: ${{ env.TARBALL }}

      - name: Publish package
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry-run }}" = "true" ]; then
            echo "::notice::Dry run — skipping publish"
            npm publish --dry-run
          else
            echo "::notice::Publishing ${TARBALL} via OIDC trusted publishing"
            npm publish
          fi
