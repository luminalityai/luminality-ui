name: Dependabot auto-merge

# Thin caller: delegates to the org-shared reusable auto-lander in
# luminalityai/.github, which merges with the release-bot App token (falling
# back to GITHUB_TOKEN loudly). A merge made with GITHUB_TOKEN does not trigger
# `on: push` workflows, so the inline version this replaces landed PRs on main
# without running pages.yml. The reusable gates both paths itself: Dependabot
# patch/minor, and release-bot PRs on issue-worker/, ci-fix/, sentry-autofix/
# and legal-sync/ branches.

on: pull_request_target

permissions: {}

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]' || github.actor == 'luminality-release-bot[bot]'
    permissions:
      contents: write
      pull-requests: write
    uses: luminalityai/.github/.github/workflows/dependabot-auto-merge.yml@7450c1ec27d245b5098b72e8b949d967b1cbb799 # main @ 2026-09-24
    secrets: inherit
